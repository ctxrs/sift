[package]
name = "retok"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lossless, token-counted compaction of tool output"
license = "MIT"
repository = "https://github.com/ctxrs/retok"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
tiktoken-rs = "0.12"

[profile.release]
strip = "symbols"

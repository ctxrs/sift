[package]
name = "sift"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Lossless, token-counted compaction of tool output"
license = "MIT"
repository = "https://github.com/ctxrs/sift"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
regex-automata = "=0.4.18"
# Keep the runtime archive format identical to the build generator. Conflicting
# downstream format features must fail compilation, never silently change it.
rkyv = { version = "=0.8.18", features = ["little_endian", "aligned", "pointer_width_32"] }
toml_edit = "=0.23.7"
serde_yaml_ng = "=0.10.0"
yaml-edit = { version = "=0.3.1", default-features = false }
json5 = "=1.3.1"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
bpe-openai = "=0.3.1"
tiktoken-rs = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = "symbols"

[build-dependencies]
bpe-openai = "=0.3.1"
bpe = "=0.2.2"
aneubeck-daachorse = "=1.1.1"
rmp-serde = "=1.3.1"
serde = { version = "1", features = ["derive"] }
regex-automata = "=0.4.18"
rkyv = { version = "=0.8.18", features = ["little_endian", "aligned", "pointer_width_32"] }

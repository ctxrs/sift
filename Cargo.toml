[package]
name = "retok"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Lossless, token-counted compaction of tool output"
license = "MIT"
repository = "https://github.com/ctxrs/retok"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
bpe-openai = "=0.3.1"
toml_edit = "=0.23.7"
serde_yaml_ng = "=0.10.0"
yaml-edit = { version = "=0.3.1", default-features = false }
json5 = "=1.3.1"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tiktoken-rs = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = "symbols"
